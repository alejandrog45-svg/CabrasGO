<!doctype html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
body { background: radial-gradient(circle at 85% 10%, rgba(16,185,129,0.22), transparent 42%), #131B2E; color: #F8FAFC; }
.ribbon { background: #10B981; box-shadow: 0 10px 28px rgba(16,185,129,0.4); }
h1 .accent { color: #34D399; }
.tagline { color: #94A3B8; }
.bottom-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); }
.bottom-text .label { color: #E2E8F0; }
.bottom-text .url { color: #34D399; }
.sunburst { background: repeating-conic-gradient(rgba(16,185,129,0.10) 0deg 4deg, transparent 4deg 12deg); }
</style>
</head>
<body>
<div class="sunburst"></div>
<div class="wrap">
  <div class="badge"><img src="../../frontend/public/logo.png" /></div>
  <div class="ribbon">SUMATE COMO CONDUCTOR</div>
  <h1>Manejá con<br/>CabrasGo</h1>
  <p class="tagline">85% de tu tarifa neta para vos. Aceptá viajes desde tu celular.</p>
  <div class="bottom-card">
    <div class="bottom-text">
      <div class="label">Escaneá para instalar</div>
      <div class="url">cabrasgo.web.app</div>
    </div>
    <div class="qr-box"><img src="../assets/qr/qr-conductor.png" /></div>
  </div>
</div>
</body>
</html>
