<!doctype html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css" />
<style>
body { background: radial-gradient(circle at 15% 8%, rgba(16,185,129,0.18), transparent 42%), #F8FAFC; color: #0F172A; }
.ribbon { background: linear-gradient(90deg,#10B981,#0F766E); box-shadow: 0 10px 28px rgba(16,185,129,0.35); }
h1 .accent { color: #0F766E; }
.tagline { color: #475569; }
.bottom-card { background: #0F172A; border: 1px solid rgba(255,255,255,0.1); }
.bottom-text .label { color: #E2E8F0; }
.bottom-text .url { color: #0F766E; }
.sunburst { background: repeating-conic-gradient(rgba(16,185,129,0.12) 0deg 4deg, transparent 4deg 12deg); }
</style>
</head>
<body>
<div class="sunburst"></div>
<div class="wrap">
  <div class="badge"><img src="../../frontend/public/logo.png" /></div>
  <div class="ribbon">5% DE DESCUENTO</div>
  <h1>Instala<br/>CabrasGo</h1>
  <p class="tagline">Tu viaje seguro por Las Cabras, Peumo y el Lago Rapel. 5% de descuento al instalar la app.</p>
  <div class="bottom-card">
    <div class="bottom-text">
      <div class="label">Escanea para instalar</div>
      <div class="url">cabrasgo.web.app</div>
    </div>
    <div class="qr-box"><img src="../assets/qr/qr-pasajero.png" /></div>
  </div>
</div>
</body>
</html>
